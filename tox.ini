[base]
testdeps =
    -rrequirements.txt
    pytest
    pytest-cov
    coverage[toml]

[tox]
envlist =
    lint
    check-packaging
    py{312}

minversion = 3.18

[testenv]
deps =
    {[base]testdeps}
setenv =
  PROJECT_ID = proj
  VIRTUAL_LAB_ID = vlab
  DB_API_URL= foo
  KEYCLOAK_SERVER_URL = http://foo
  KEYCLOAK_REALM = test
  KEYCLOAK_CLIENT_ID = workflow
  KEYCLOAK_CLIENT_SECRET = secret
commands =
    python -m pytest {posargs}
    python -m coverage xml
    python -m coverage html

[testenv:lint]
deps =
    ruff
    mypy
commands =
	python -m ruff format --check
	python -m ruff check
    # python -m mypy src

[testenv:format]
deps =
    ruff
commands =
	python -m ruff format
	python -m ruff check --fix

[testenv:check-packaging]
skip_install = true
deps =
    build
    twine
commands =
    python -m build -o {envtmpdir}/dist
    twine check {envtmpdir}/dist/*me} tests
